# JWT for the speech proxies: Authorization header, or ?token= (browsers cannot set headers on WebSockets)
map $arg_token $speech_auth_from_query {
    ""      "";
    default "Bearer $arg_token";
}
map $http_authorization $speech_auth {
    ""      $speech_auth_from_query;
    default $http_authorization;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to backend
    location /api/ {
        # BE accepts uploads up to 20MB; AI question generation runs synchronously and can take minutes
        client_max_body_size 25m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Docker DNS; resolving speech services lazily keeps nginx up when the GPU services are not running
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Internal JWT check reused by the speech proxies (any signed-in user)
    location = /_auth {
        internal;
        proxy_pass http://backend:8080/api/v1/users/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $speech_auth;
    }

    # Speech-to-text WebSocket (oral exam room) -> stt-service
    location /ws/stt {
        auth_request /_auth;
        set $stt_upstream http://stt-service:8002;
        proxy_pass $stt_upstream/ws/transcribe$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Text-to-speech (question reading) -> tts-service
    location /tts/ {
        auth_request /_auth;
        set $tts_upstream http://tts-service:8001;
        rewrite ^/tts/(.*)$ /$1 break;
        proxy_pass $tts_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
