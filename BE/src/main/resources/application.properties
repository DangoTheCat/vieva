spring.application.name=vieva

# Server port
server.port=8080

# PostgreSQL + PGVector Datasource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vieva_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — Flyway owns the schema; ddl-auto=validate detects drift without modifying schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disable SQL logging by default — enable only in local dev via environment override
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway — single source of truth for schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate=true: safely handles existing DBs without flyway_schema_history table.
# baseline-version must be LESS than the lowest migration version (V0) so V0 still runs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0.0

# JWT Configuration — MUST be supplied via environment variable; no hardcoded fallback
# Generate a secure key: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:1}
jwt.issuer=vieva

# Spring AI Vector Store (PGVector)
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

# Spring AI OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:test-dummy-key}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

