# Test configuration for VievaApplicationTests
# Excludes live relational database and pgvector autoconfiguration during slice/context unit testing without live PostgreSQL instance
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# Dummy API key for Spring AI initialization during unit testing without calling external API
spring.ai.openai.api-key=test-dummy-key-for-local-build
