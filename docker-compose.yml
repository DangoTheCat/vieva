services:
  # PostgreSQL with PGVector extension pre-installed
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vieva-postgres
    restart: unless-stopped
    ports:
      # Bind to localhost only — do NOT expose DB to external interfaces
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-vieva_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BE/src/main/resources/db/migration:/opt/vieva-schema:ro
      - ./BE/src/main/resources/db/init.sh:/docker-entrypoint-initdb.d/01-vieva.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-vieva_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Spring Boot Application (Starts by default with postgres)
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: vieva-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vieva_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env var is required}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-1}
      TTS_BASE_URL: ${DOCKER_TTS_BASE_URL:-http://tts-service:8001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test-dummy-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      VIEVA_AI_PROVIDER: ${VIEVA_AI_PROVIDER:-mock}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      VIEVA_MAIL_PROVIDER: ${VIEVA_MAIL_PROVIDER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_LOGIN_URL: ${APP_LOGIN_URL:-http://localhost:5173/login}
    volumes:
      - backend_documents:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend Web Client (React + Tailwind + Nginx) - Optional profile
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: vieva-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    profiles:
      - frontend
      - full
    depends_on:
      - backend

  # AI Speech-to-Text Service (faster-whisper GPU) - Opt-in GPU profile
  stt-service:
    build:
      context: ./ai-services/stt
      dockerfile: Dockerfile
    container_name: vieva-stt
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    profiles:
      - stt-gpu
      - gpu
      - full
    environment:
      - STT_MODEL_ID=suzii/vi-whisper-large-v3-turbo
      - STT_DEVICE=cuda
      - STT_COMPUTE_TYPE=float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # AI Text-to-Speech Service (ZeroTTS CPU) - Optional CPU profile
  tts-service:
    build:
      context: ./ai-services/tts
      dockerfile: Dockerfile
    container_name: vieva-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    profiles:
      - tts
      - full
    environment:
      - TTS_MODEL_ID=zeroweight-ai/ZeroTTS
      - TTS_DEFAULT_SPEAKER=maichi
    volumes:
      - tts_model_cache:/root/.cache/huggingface

  # Run Backend Test Suite via Docker: docker compose run --rm test
  test:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: vieva-test
    volumes:
      - ./BE:/build
      - ~/.m2:/root/.m2
    working_dir: /build
    command: ["mvn", "test", "-Dtest=!*IntegrationTest"]
    profiles:
      - test

volumes:
  postgres_data:
  backend_documents:
  tts_model_cache:
