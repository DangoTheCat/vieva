services:
  # PostgreSQL with PGVector extension pre-installed
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vieva-postgres
    restart: unless-stopped
    ports:
      # Bind to localhost only — do NOT expose DB to external interfaces
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-vieva_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BE/src/main/resources/db/migration:/opt/vieva-schema:ro
      - ./BE/src/main/resources/db/init.sh:/docker-entrypoint-initdb.d/01-vieva.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vieva_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Spring Boot Application (Optional: can run in container or via local IDE)
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: vieva-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vieva_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env var is required}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test-dummy-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      VIEVA_AI_PROVIDER: ${VIEVA_AI_PROVIDER:-mock}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      VIEVA_MAIL_PROVIDER: ${VIEVA_MAIL_PROVIDER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_LOGIN_URL: ${APP_LOGIN_URL:-http://localhost:5173/login}
      # Inside Docker the speech services are reached by service name (the .env values are for local runs)
      TTS_BASE_URL: http://tts-service:8001
      STT_BASE_URL: http://stt-service:8002
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Web Client (React + Tailwind + Nginx)
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: vieva-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # AI Speech-to-Text Service (faster-whisper GPU)
  stt-service:
    build:
      context: ./ai-services/stt
      dockerfile: Dockerfile
    container_name: vieva-stt
    # Needs an NVIDIA GPU: start with `docker compose --profile gpu up`
    profiles:
      - gpu
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - STT_MODEL_ID=suzii/vi-whisper-large-v3-turbo
      - STT_DEVICE=cuda
      - STT_COMPUTE_TYPE=float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # AI Text-to-Speech Service (ZeroTTS GPU)
  tts-service:
    build:
      context: ./ai-services/tts
      dockerfile: Dockerfile
    container_name: vieva-tts
    profiles:
      - gpu
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - TTS_MODEL_ID=zeroweight-ai/ZeroTTS
      - TTS_DEFAULT_SPEAKER=maichi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Run Backend Test Suite via Docker: docker compose run --rm test
  test:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: vieva-test
    volumes:
      - ./BE:/build
      - ~/.m2:/root/.m2
    working_dir: /build
    command: ["mvn", "test", "-Dtest=!*IntegrationTest"]
    profiles:
      - test

volumes:
  postgres_data:
