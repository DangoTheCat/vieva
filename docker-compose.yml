services:
  # PostgreSQL with PGVector extension pre-installed
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vieva-postgres
    restart: unless-stopped
    ports:
      # Bind to localhost only — do NOT expose DB to external interfaces
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-vieva_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vieva_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Spring Boot Application (Optional: can run in container or via local IDE)
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: vieva-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vieva_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env var is required}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test-dummy-key}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
